  /api/brokers/{broker_id}/instruments:
    get:
      tags:
      - instruments
      summary: Instruments
      operationId: instruments_api_brokers__broker_id__instruments_get
      parameters:
      - name: broker_id
        in: path
        required: true
        schema:
          type: string
          title: Broker Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      - name: selected_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Selected Only
      - name: lot_price_from
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Lot Price From
      - name: lot_price_to
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Lot Price To
      - name: currency
        in: query
        required: false
        schema:
          type: string
          default: RUB
          title: Currency
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
