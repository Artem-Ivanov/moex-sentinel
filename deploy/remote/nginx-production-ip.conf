# Install alongside nginx-ip.conf only after approval; share its login rate zone.
server {
    listen 8443 ssl http2;
    server_name 135.136.178.252;
    ssl_certificate /etc/letsencrypt/live/moex-sentinel-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moex-sentinel-ip/privkey.pem;

    if ($host != "135.136.178.252") {
        return 444;
    }

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    location ^~ /internal/ {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=moex_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}
