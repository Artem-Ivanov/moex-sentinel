# Use only with compose.yml through compose.sh. Docker Compose >= 2.24.4.
x-runtime: &runtime
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  database:
    <<: *runtime
    ports: !reset []
    networks:
      default: {}
      data:
        aliases: [sentinel-shared-postgres]

  migrations:
    networks: [default, data]
    image: moex-sentinel-migrations:${RELEASE_TAG:?Set a unique release tag}

  backend:
    <<: *runtime
    networks: [default, data]
    image: moex-sentinel-backend:${RELEASE_TAG:?Set a unique release tag}
    environment:
      AUTH_INSECURE_LOOPBACK: "false"

  portfolio-snapshot-worker:
    <<: *runtime
    networks: [default, data]
    environment:
      PORTFOLIO_SNAPSHOT_ALL_ENVIRONMENTS: "true"
    image: moex-sentinel-portfolio-snapshot-worker:${RELEASE_TAG:?Set a unique release tag}

  analytics:
    <<: *runtime
    image: moex-sentinel-analytics:${RELEASE_TAG:?Set a unique release tag}

  trading-automaton:
    <<: *runtime
    stop_grace_period: 120s
    image: moex-sentinel-trading-automaton:${RELEASE_TAG:?Set a unique release tag}
    profiles: [trading]
    # The SQLite intent/outbox owner must remain a singleton.
    scale: 1

  frontend:
    <<: *runtime
    image: moex-sentinel-frontend:${RELEASE_TAG:?Set a unique release tag}
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"

networks:
  data:
    external: true
    name: moex-sentinel-data
