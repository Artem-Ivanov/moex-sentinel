name = "moex_backend_developer"
description = "Senior-разработчик backend MOEX Sentinel: ограниченные изменения Python Core/Worker/Analytics, серверных контрактов, хранения и поведенческих тестов."
model = "gpt-6-luna"
model_reasoning_effort = "high"
