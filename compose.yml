services:
  python-base:
    profiles:
      - build
    image: moex-sentinel-python-base:local
    build:
      context: .
      dockerfile: docker/python-base.Dockerfile

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  migrations:
    profiles:
      - migrations
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    command:
      - moex-migrate-schema

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@database:5432/${POSTGRES_DB}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      SANDBOX_RETRY_LIMIT: "${SANDBOX_RETRY_LIMIT:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  portfolio-snapshot-worker:
    build:
      context: .
      dockerfile: docker/portfolio-snapshot-worker.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@database:5432/${POSTGRES_DB}
      PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS: "${PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS:-60}"
      LOG_LEVEL: INFO
      LOG_FORMAT: json

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ANALYTICS_CORE_URL: http://backend:8000
    read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  trading-automaton:
    build:
      context: .
      dockerfile: docker/automaton.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      AUTOMATON_DATABASE_URL: sqlite:////app/data/trading_automaton.db
      CORE_URL: http://backend:8000
      ANALYTICS_URL: http://analytics:8001
      AUTOMATON_HEARTBEAT_INTERVAL_SECONDS: "3"
      FACT_OUTBOX_BATCH_SIZE: "100"
      FACT_OUTBOX_DEADLINE_MS: "1000"
      STRATEGY_BUY_ORDER_LOTS: "${STRATEGY_BUY_ORDER_LOTS:-1}"
      STRATEGY_STOP_LOSS_PERCENT: "${STRATEGY_STOP_LOSS_PERCENT:-5}"
      STRATEGY_TAKE_PROFIT_PERCENT: "${STRATEGY_TAKE_PROFIT_PERCENT:-6}"
      STRATEGY_AVERAGING_STEP_PERCENT: "${STRATEGY_AVERAGING_STEP_PERCENT:-0.5}"
      STRATEGY_PARTIAL_TAKE_PROFIT_PERCENT: "${STRATEGY_PARTIAL_TAKE_PROFIT_PERCENT:-0.5}"
      STRATEGY_PARTIAL_SELL_PERCENT: "${STRATEGY_PARTIAL_SELL_PERCENT:-25}"
      STRATEGY_MAX_PARTIAL_SELL_STEPS: "${STRATEGY_MAX_PARTIAL_SELL_STEPS:-3}"
      STRATEGY_ORDER_TTL_SECONDS: "${STRATEGY_ORDER_TTL_SECONDS:-10}"
      STRATEGY_ORDER_RETRY_LIMIT: "${STRATEGY_ORDER_RETRY_LIMIT:-3}"
      STRATEGY_CORE_RETRY_LIMIT: "${STRATEGY_CORE_RETRY_LIMIT:-5}"
      STRATEGY_ENABLED: "${STRATEGY_ENABLED:-true}"
      SANDBOX_RETRY_LIMIT: "${SANDBOX_RETRY_LIMIT:-5}"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
    volumes:
      - automaton-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-moex-sentinel-postgres-data}
  automaton-data:
    external: true
    name: ${AUTOMATON_VOLUME_NAME:-moex-sentinel_automaton-data}
