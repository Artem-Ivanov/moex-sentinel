services:
  python-base:
    profiles:
      - build
    image: moex-sentinel-python-base:local
    build:
      context: .
      dockerfile: docker/python-base.Dockerfile

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: &runtime-logging
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-5}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10

  migrations:
    profiles:
      - migrations
    build:
      context: .
      dockerfile: docker/migrations.Dockerfile
    depends_on:
      database:
        condition: service_healthy
    logging: *runtime-logging
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_HOST:-database}:5432/${POSTGRES_DB}
    command:
      - moex-migrate-schema

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    init: true
    restart: unless-stopped
    logging: *runtime-logging
    depends_on:
      database:
        condition: service_healthy
    environment:
      ANALYTICS_URL: "${CORE_ANALYTICS_URL-http://analytics:8001}"
      APPLICATION_ENVIRONMENT: "${APPLICATION_ENVIRONMENT:?APPLICATION_ENVIRONMENT must be configured}"
      BROKER_ACCESS_MODE: "${BROKER_ACCESS_MODE:?BROKER_ACCESS_MODE must be configured}"
      INTERNAL_WORKER_ID: "${INTERNAL_WORKER_ID:-}"
      INTERNAL_WORKER_BROKER_ID: "${INTERNAL_WORKER_BROKER_ID:-}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
      DAILY_ADMISSION_PREPARATION_ENABLED: "${DAILY_ADMISSION_PREPARATION_ENABLED:-false}"
      DAILY_ADMISSION_CHECK_INTERVAL_SECONDS: "${DAILY_ADMISSION_CHECK_INTERVAL_SECONDS:-60}"
      DAILY_ADMISSION_ATTEMPT_TIMEOUT_SECONDS: "${DAILY_ADMISSION_ATTEMPT_TIMEOUT_SECONDS:-30}"
      DAILY_ADMISSION_RETRY_DELAYS_SECONDS: "${DAILY_ADMISSION_RETRY_DELAYS_SECONDS:-[60,120,300]}"
      READINESS_ALERT_POLL_INTERVAL_SECONDS: "${READINESS_ALERT_POLL_INTERVAL_SECONDS:-10}"
      READINESS_ALERT_STARTUP_GRACE_SECONDS: "${READINESS_ALERT_STARTUP_GRACE_SECONDS:-60}"
      READINESS_ALERT_HEARTBEAT_CONFIRMATION_SECONDS: "${READINESS_ALERT_HEARTBEAT_CONFIRMATION_SECONDS:-30}"
      READINESS_ALERT_CONTROL_CONFIRMATION_SECONDS: "${READINESS_ALERT_CONTROL_CONFIRMATION_SECONDS:-30}"
      READINESS_ALERT_OUTBOX_CONFIRMATION_SECONDS: "${READINESS_ALERT_OUTBOX_CONFIRMATION_SECONDS:-60}"
      READINESS_ALERT_RETRY_DELAYS_SECONDS: "${READINESS_ALERT_RETRY_DELAYS_SECONDS:-[30,60,300]}"
      READINESS_ALERT_QUEUE_LIMIT: "${READINESS_ALERT_QUEUE_LIMIT:-16}"
      TELEGRAM_REQUEST_TIMEOUT_SECONDS: "${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-5}"
      MARKET_RECOVERY_RETRY_BASE_SECONDS: "${MARKET_RECOVERY_RETRY_BASE_SECONDS:-1}"
      MARKET_RECOVERY_PROBE_INTERVAL_SECONDS: "${MARKET_RECOVERY_PROBE_INTERVAL_SECONDS:-60}"
      MARKET_OPERATION_TIMEOUT_SECONDS: "${MARKET_OPERATION_TIMEOUT_SECONDS:-10}"
      MARKET_CLOSE_TIMEOUT_SECONDS: "${MARKET_CLOSE_TIMEOUT_SECONDS:-5}"
      MARKET_QUIET_SECONDS: "${MARKET_QUIET_SECONDS:-30}"
      MARKET_TRADING_STATUS_TTL_SECONDS: "${MARKET_TRADING_STATUS_TTL_SECONDS:-30}"
      MARKET_CANDLES_REFRESH_SECONDS: "${MARKET_CANDLES_REFRESH_SECONDS:-60}"
      ANALYTICS_VERSION_HTTP_TIMEOUT_SECONDS: "${ANALYTICS_VERSION_HTTP_TIMEOUT_SECONDS:-1}"
      TELEGRAM_ALERTS_ENABLED: "${TELEGRAM_ALERTS_ENABLED:-false}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@${DATABASE_HOST:-database}:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      SANDBOX_RETRY_LIMIT: "${SANDBOX_RETRY_LIMIT:-5}"
      AUTH_USERNAME: "${AUTH_USERNAME:?AUTH_USERNAME must be configured}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:?AUTH_PASSWORD_HASH must be configured}"
      AUTH_SESSION_COOKIE_NAME: "${AUTH_SESSION_COOKIE_NAME:-__Host-moex-session}"
      AUTH_ALLOWED_ORIGIN: "${AUTH_ALLOWED_ORIGIN:?AUTH_ALLOWED_ORIGIN must be configured}"
      AUTH_INSECURE_LOOPBACK: "${AUTH_INSECURE_LOOPBACK:-false}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  portfolio-snapshot-worker:
    build:
      context: .
      dockerfile: docker/portfolio-snapshot-worker.Dockerfile
    init: true
    restart: unless-stopped
    logging: *runtime-logging
    depends_on:
      database:
        condition: service_healthy
    environment:
      APPLICATION_ENVIRONMENT: "${APPLICATION_ENVIRONMENT:?APPLICATION_ENVIRONMENT must be configured}"
      BROKER_ACCESS_MODE: "${BROKER_ACCESS_MODE:?BROKER_ACCESS_MODE must be configured}"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@${DATABASE_HOST:-database}:5432/${POSTGRES_DB}
      PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS: "${PORTFOLIO_SNAPSHOT_INTERVAL_SECONDS:-60}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      DATABASE_POOL_TIMEOUT_SECONDS: "${DATABASE_POOL_TIMEOUT_SECONDS:-5}"
      PORTFOLIO_SNAPSHOT_ALL_ENVIRONMENTS: "${PORTFOLIO_SNAPSHOT_ALL_ENVIRONMENTS:-false}"
      PORTFOLIO_SNAPSHOT_RETRY_LIMIT: "${PORTFOLIO_SNAPSHOT_RETRY_LIMIT:-3}"
      PORTFOLIO_SNAPSHOT_RETRY_BASE_SECONDS: "${PORTFOLIO_SNAPSHOT_RETRY_BASE_SECONDS:-1}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"

  analytics:
    build:
      context: .
      dockerfile: docker/analytics.Dockerfile
    init: true
    restart: unless-stopped
    logging: *runtime-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      ANALYTICS_CORE_URL: "${ANALYTICS_CORE_URL:-http://backend:8000}"
      ANALYTICS_CORE_HTTP_TIMEOUT_SECONDS: "${ANALYTICS_CORE_HTTP_TIMEOUT_SECONDS:-2}"
    read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  trading-automaton:
    stop_grace_period: 120s
    build:
      context: .
      dockerfile: docker/automaton.Dockerfile
    init: true
    restart: unless-stopped
    logging: *runtime-logging
    depends_on:
      backend:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      APPLICATION_ENVIRONMENT: "${APPLICATION_ENVIRONMENT:?APPLICATION_ENVIRONMENT must be configured}"
      BROKER_ACCESS_MODE: "${BROKER_ACCESS_MODE:?BROKER_ACCESS_MODE must be configured}"
      INTERNAL_WORKER_ID: "${INTERNAL_WORKER_ID:-}"
      INTERNAL_WORKER_BROKER_ID: "${INTERNAL_WORKER_BROKER_ID:-}"
      INTERNAL_WORKER_TOKEN: "${INTERNAL_WORKER_TOKEN:-}"
      AUTOMATON_WORKER_ID: "${AUTOMATON_WORKER_ID:-${INTERNAL_WORKER_ID:-trading-automaton-1}}"
      AUTOMATON_DATABASE_URL: "${AUTOMATON_DATABASE_URL:-sqlite:////app/data/trading_automaton.db}"
      CORE_URL: "${CORE_URL:-http://backend:8000}"
      ANALYTICS_URL: "${ANALYTICS_URL:-http://analytics:8001}"
      AUTOMATON_ITERATION_SECONDS: "${AUTOMATON_ITERATION_SECONDS:-1}"
      AUTOMATON_HEARTBEAT_INTERVAL_SECONDS: "${AUTOMATON_HEARTBEAT_INTERVAL_SECONDS:-3}"
      AUTOMATON_CORE_HTTP_TIMEOUT_SECONDS: "${AUTOMATON_CORE_HTTP_TIMEOUT_SECONDS:-10}"
      AUTOMATON_ANALYTICS_HTTP_TIMEOUT_SECONDS: "${AUTOMATON_ANALYTICS_HTTP_TIMEOUT_SECONDS:-1}"
      AUTOMATON_BROKER_RECOVERY_PROBE_SECONDS: "${AUTOMATON_BROKER_RECOVERY_PROBE_SECONDS:-60}"
      AUTOMATON_ACCOUNT_SNAPSHOT_TTL_SECONDS: "${AUTOMATON_ACCOUNT_SNAPSHOT_TTL_SECONDS:-60}"
      BROKER_REQUEST_TIMEOUT_SECONDS: "${BROKER_REQUEST_TIMEOUT_SECONDS:-10}"
      FACT_OUTBOX_BATCH_SIZE: "${FACT_OUTBOX_BATCH_SIZE:-100}"
      FACT_OUTBOX_DEADLINE_MS: "${FACT_OUTBOX_DEADLINE_MS:-1000}"
      STRATEGY_BUY_ORDER_LOTS: "${STRATEGY_BUY_ORDER_LOTS:-1}"
      STRATEGY_STOP_LOSS_PERCENT: "${STRATEGY_STOP_LOSS_PERCENT:-5}"
      STRATEGY_TAKE_PROFIT_PERCENT: "${STRATEGY_TAKE_PROFIT_PERCENT:-6}"
      STRATEGY_AVERAGING_STEP_PERCENT: "${STRATEGY_AVERAGING_STEP_PERCENT:-0.5}"
      STRATEGY_PARTIAL_TAKE_PROFIT_PERCENT: "${STRATEGY_PARTIAL_TAKE_PROFIT_PERCENT:-0.5}"
      STRATEGY_PARTIAL_SELL_PERCENT: "${STRATEGY_PARTIAL_SELL_PERCENT:-25}"
      STRATEGY_MAX_PARTIAL_SELL_STEPS: "${STRATEGY_MAX_PARTIAL_SELL_STEPS:-3}"
      STRATEGY_ORDER_TTL_SECONDS: "${STRATEGY_ORDER_TTL_SECONDS:-10}"
      STRATEGY_ORDER_RETRY_LIMIT: "${STRATEGY_ORDER_RETRY_LIMIT:-3}"
      STRATEGY_CORE_RETRY_LIMIT: "${STRATEGY_CORE_RETRY_LIMIT:-5}"
      STRATEGY_ENABLED: "${STRATEGY_ENABLED:-false}"
      SANDBOX_RETRY_LIMIT: "${SANDBOX_RETRY_LIMIT:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
    volumes:
      - automaton-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    init: true
    restart: unless-stopped
    logging: *runtime-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:-moex-sentinel-postgres-data}
  automaton-data:
    external: true
    name: ${AUTOMATON_VOLUME_NAME:-moex-sentinel_automaton-data}
